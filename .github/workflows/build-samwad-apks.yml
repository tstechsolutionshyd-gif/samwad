
name: Build Samwad Student and Admin APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    defaults:
      run:
        working-directory: Samwad_Student_Admin_Logo_Branded_Android_Source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user Pillow

      - name: Prepare original Samwad logo
        run: |
          python3 scripts/prepare_icons.py

      - name: Build Student Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleStudentDebug

      - name: Build Admin Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleAdminDebug

      - name: Verify APK files
        run: |
          test -f app/build/outputs/apk/student/debug/app-student-debug.apk
          test -f app/build/outputs/apk/admin/debug/app-admin-debug.apk
          ls -lh app/build/outputs/apk/student/debug/
          ls -lh app/build/outputs/apk/admin/debug/

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: Samwad-Student-APK
          path: Samwad_Student_Admin_Logo_Branded_Android_Source/app/build/outputs/apk/student/debug/app-student-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samwad-Admin-APK
          path: Samwad_Student_Admin_Logo_Branded_Android_Source/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
          retention-days: 30
