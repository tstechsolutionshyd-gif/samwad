
plugins {
    id 'com.android.application'
}

android {
    namespace 'in.samwad.learning'
    compileSdk 35

    defaultConfig {
        applicationId 'in.samwad.learning'
        minSdk 26
        targetSdk 35

        versionCode 2
        versionName '1.0.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'audience'

    productFlavors {
        student {
            dimension 'audience'
            applicationIdSuffix '.student'

            resValue 'string', 'app_name', 'Samwad Student'

            buildConfigField 'String', 'START_URL', '"https://portal.tscreativesanddigitalmarketing.online/student/login"'

            buildConfigField 'boolean', 'IS_ADMIN_APP', 'false'
        }

        admin {
            dimension 'audience'
            applicationIdSuffix '.admin'

            resValue 'string', 'app_name', 'Samwad Admin'

            buildConfigField 'String', 'START_URL', '"https://portal.tscreativesanddigitalmarketing.online/admin/login"'

            buildConfigField 'boolean', 'IS_ADMIN_APP', 'true'
        }
    }

    signingConfigs {
        if (
            System.getenv('SAMWAD_KEYSTORE_PATH') &&
            System.getenv('SAMWAD_KEYSTORE_PASSWORD') &&
            System.getenv('SAMWAD_KEY_ALIAS') &&
            System.getenv('SAMWAD_KEY_PASSWORD')
        ) {
            release {
                storeFile file(System.getenv('SAMWAD_KEYSTORE_PATH'))
                storePassword System.getenv('SAMWAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SAMWAD_KEY_ALIAS')
                keyPassword System.getenv('SAMWAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false

            if (
                System.getenv('SAMWAD_KEYSTORE_PATH') &&
                System.getenv('SAMWAD_KEYSTORE_PASSWORD') &&
                System.getenv('SAMWAD_KEY_ALIAS') &&
                System.getenv('SAMWAD_KEY_PASSWORD')
            ) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
