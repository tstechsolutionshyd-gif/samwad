plugins { id 'com.android.application' }

android {
    // Release signing is only activated when keystore settings are supplied from
    // environment variables; never commit secrets or a release keystore.
    def releaseKeyPath = System.getenv('SAMWAD_KEYSTORE_PATH')
    def releaseKeyPassword = System.getenv('SAMWAD_KEYSTORE_PASSWORD')
    def releaseAlias = System.getenv('SAMWAD_KEY_ALIAS')
    def releaseAliasPassword = System.getenv('SAMWAD_KEY_PASSWORD')

    signingConfigs {
        if (releaseKeyPath && releaseKeyPassword && releaseAlias && releaseAliasPassword) {
            release {
                storeFile file(releaseKeyPath)
                storePassword releaseKeyPassword
                keyAlias releaseAlias
                keyPassword releaseAliasPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeyPath && releaseKeyPassword && releaseAlias && releaseAliasPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace 'in.samwad.learning'
    compileSdk 35

    defaultConfig {
        applicationId 'in.samwad.learning'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'audience'
    productFlavors {
        student {
            dimension 'audience'
            applicationIdSuffix '.student'
            resValue 'string', 'app_name', 'Samwad Student'
            buildConfigField 'String', 'START_URL', '"
productFlavors {
    student {
        dimension 'audience'
        applicationIdSuffix '.student'
        resValue 'string', 'app_name', 'Samwad Student'
        buildConfigField 'String', 'START_URL', '"https://portal.tscreativesanddigitalmarketing.online/student/login"'
    }
    admin {
        dimension 'audience'
        applicationIdSuffix '.admin'
        resValue 'string', 'app_name', 'Samwad Admin'
        buildConfigField 'String', 'START_URL', '"https://portal.tscreativesanddigitalmarketing.online/admin/login"'
    }
}
"'
